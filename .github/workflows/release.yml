name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          make build PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64" WITH=serve,gscp VERSION="$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes
          # 每个平台二进制带平台后缀重命名上传，避免同名资产触发 404 且匹配文档下载 URL
          gh release upload "$TAG" \
            build/linux-amd64/owl#owl-linux-amd64 \
            build/linux-arm64/owl#owl-linux-arm64 \
            build/darwin-amd64/owl#owl-darwin-amd64 \
            build/darwin-arm64/owl#owl-darwin-arm64 \
            build/windows-amd64/owl.exe#owl-windows-amd64.exe \
            build/linux-amd64/owl-serve#owl-serve-linux-amd64 \
            build/linux-arm64/owl-serve#owl-serve-linux-arm64 \
            build/darwin-amd64/owl-serve#owl-serve-darwin-amd64 \
            build/darwin-arm64/owl-serve#owl-serve-darwin-arm64 \
            build/windows-amd64/owl-serve.exe#owl-serve-windows-amd64.exe \
            build/linux-amd64/gscp#gscp-linux-amd64 \
            build/linux-arm64/gscp#gscp-linux-arm64 \
            build/darwin-amd64/gscp#gscp-darwin-amd64 \
            build/darwin-arm64/gscp#gscp-darwin-arm64 \
            build/windows-amd64/gscp.exe#gscp-windows-amd64.exe
